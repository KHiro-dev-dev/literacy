<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    strong {
        color:#0000ff
    }

    em {
        color:#ff0000
    }
  </style>
</head>

<body>
  <p>
    むかしむかしあるところに、<strong>おじいさん</strong>と<em>おばあさん</em>がいました。
    <br><strong>おじいさん</strong>は山に芝刈りに、<em>おばあさん</em>は川に洗濯にいきました。
  </p>
</body>

</html>
